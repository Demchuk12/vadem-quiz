<button
  vdButton
  size="sm"
  variant="ghost"
  iconOnly
  [attr.aria-label]="t().label(quiz().title)"
  (click)="confirming.set(true)"
>
  <vd-icon name="trash" />
</button>

<vd-alert-dialog
  [title]="t().title"
  [description]="t().text(quiz().title)"
  [confirmLabel]="t().confirm"
  [cancelLabel]="t().cancel"
  variant="danger"
  [open]="confirming()"
  [action]="remove"
  (openChange)="confirming.set($event)"
/>
