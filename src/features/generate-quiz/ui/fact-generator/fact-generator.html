<section vdCard>
  <form [formGroup]="form" (ngSubmit)="start()">
    <vd-field
      [label]="t().facts.topic"
      [hint]="t().facts.hint"
      [error]="t().promptError"
      [descriptionIds]="promptCount.descriptionId()"
    >
      <textarea
        vdInput
        id="facts-topic"
        rows="3"
        formControlName="prompt"
        [placeholder]="t().facts.placeholder"
      ></textarea>
      <vd-character-count
        #promptCount
        controlId="facts-topic"
        [value]="prompt()"
        [maxLength]="maxLength"
      />
    </vd-field>
    <div class="writer">
      <vd-field class="provider-field" [label]="t().facts.writer">
        <vd-select [value]="ai.provider()" (valueChange)="ai.choose($any($event))">
          <vq-ai-provider-icon slot="start" [provider]="ai.iconOf(ai.provider())" />
          @for (option of ai.options(); track option.id) {
            <vd-option [value]="option.id" [label]="option.label">
              <vq-ai-provider-icon [provider]="option.icon" />
              {{ option.label }}
            </vd-option>
          }
        </vd-select>
      </vd-field>
      <vq-own-ai-settings />
    </div>
    <div class="actions">
      <button vdButton type="submit" [loading]="busy()">
        <vd-icon slot="start" name="star" />
        {{ t().facts.generate(count()) }}
      </button>
      @if (busy()) {
        <vq-question-loader size="sm" [label]="t().facts.working" />
      }
    </div>
  </form>
</section>

<vd-alert-dialog
  [title]="t().facts.replaceTitle"
  [description]="t().facts.replaceText"
  [confirmLabel]="t().replace"
  [cancelLabel]="t().cancel"
  [open]="confirming()"
  [action]="replace"
  (openChange)="confirming.set($event)"
/>
