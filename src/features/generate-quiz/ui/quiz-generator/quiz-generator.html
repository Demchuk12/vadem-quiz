<section vdCard>
  <form [formGroup]="form" (ngSubmit)="start()">
    <vd-field
      [label]="t().quiz.topic"
      [hint]="t().quiz.hint"
      [error]="t().promptError"
      [descriptionIds]="promptCount.descriptionId()"
    >
      <textarea
        vdInput
        id="quiz-topic"
        rows="3"
        formControlName="prompt"
        [placeholder]="t().quiz.placeholder"
      ></textarea>
      <vd-character-count
        #promptCount
        controlId="quiz-topic"
        [value]="prompt()"
        [maxLength]="maxLength"
      />
    </vd-field>
    <label class="vd-choice">
      <input type="checkbox" vdCheckbox formControlName="images" />
      {{ t().quiz.images }}
    </label>
    <p class="hint">{{ t().quiz.imagesHint }}</p>
    <label class="vd-choice">
      <input type="checkbox" vdCheckbox formControlName="explain" />
      {{ t().quiz.explain }}
    </label>
    <p class="hint">{{ t().quiz.explainHint }}</p>
    <div class="writer">
      <vd-field class="provider-field" [label]="t().quiz.writer" [hint]="t().quiz.writerHint">
        <vd-select [value]="ai.provider()" (valueChange)="ai.choose($any($event))">
          <vq-ai-provider-icon slot="start" [provider]="ai.iconOf(ai.provider())" />
          @for (option of ai.options(); track option.id) {
            <vd-option [value]="option.id" [label]="option.label">
              <vq-ai-provider-icon [provider]="option.icon" />
              {{ option.label }}
            </vd-option>
          }
        </vd-select>
      </vd-field>
      <vq-own-ai-settings />
    </div>
    <div class="actions">
      <button vdButton type="submit" [loading]="busy()">
        <vd-icon slot="start" name="star" />
        {{ actionLabel() }}
      </button>
      @if (busy()) {
        <vq-question-loader size="sm" [label]="status()" />
      }
    </div>
  </form>
</section>

<vd-alert-dialog
  [title]="t().quiz.replaceTitle"
  [description]="t().quiz.replaceText"
  [confirmLabel]="t().replace"
  [cancelLabel]="t().cancel"
  [open]="confirming()"
  [action]="replace"
  (openChange)="confirming.set($event)"
/>
