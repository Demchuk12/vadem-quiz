<section vdCard>
  <form [formGroup]="form" (ngSubmit)="start()">
    <vd-field
      label="Тема квізу"
      hint="AI напише чернетку, а ви її перевірите: він буває впевнено неправий у фактах."
      error="Опишіть тему: від 3 до 1500 символів."
      [descriptionIds]="promptCount.descriptionId()"
    >
      <textarea
        vdInput
        id="quiz-topic"
        rows="3"
        formControlName="prompt"
        placeholder="Наприклад: кіно 90-х, середня складність"
      ></textarea>
      <vd-character-count
        #promptCount
        controlId="quiz-topic"
        [value]="prompt()"
        [maxLength]="maxLength"
      />
    </vd-field>
    <label class="vd-choice">
      <input type="checkbox" vdCheckbox formControlName="images" />
      Додати фото до відповідей
    </label>
    <p class="hint">
      Близько третини відповідей отримають фото з Вікіпедії. Його побачать, коли відповідь
      відкриють.
    </p>
    <label class="vd-choice">
      <input type="checkbox" vdCheckbox formControlName="explain" />
      Писати пояснення до відповідей
    </label>
    <p class="hint">Ведучий зможе розповісти цікавинку, коли відповідь відкриють.</p>
    <div class="writer">
      <vd-field
        class="provider-field"
        label="Хто пише питання"
        hint="«Авто» бере першу вільну модель: якщо в однієї вичерпано ліміт, раунд напише інша."
      >
        <vd-select [value]="ai.provider()" (valueChange)="ai.choose($any($event))">
          <vq-ai-provider-icon slot="start" [provider]="ai.iconOf(ai.provider())" />
          @for (option of ai.options(); track option.id) {
            <vd-option [value]="option.id" [label]="option.label">
              <vq-ai-provider-icon [provider]="option.icon" />
              {{ option.label }}
            </vd-option>
          }
        </vd-select>
      </vd-field>
      <vq-own-ai-settings />
    </div>
    <div class="actions">
      <button vdButton type="submit" [loading]="busy()">
        <vd-icon slot="start" name="star" />
        {{ actionLabel() }}
      </button>
      @if (busy()) {
        <vq-question-loader size="sm" [label]="status()" />
      }
    </div>
  </form>
</section>

<vd-alert-dialog
  title="Замінити питання?"
  description="AI перепише всі раунди цього квізу, разом із картинками. Поки ви не збережете, збережена версія лишається цілою."
  confirmLabel="Замінити"
  cancelLabel="Скасувати"
  [open]="confirming()"
  [action]="replace"
  (openChange)="confirming.set($event)"
/>
