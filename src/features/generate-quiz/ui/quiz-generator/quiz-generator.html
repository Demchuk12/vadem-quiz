<section vdCard>
  <form [formGroup]="form" (ngSubmit)="start()">
    <vd-field
      label="Тема квізу"
      hint="AI напише чернетку, а ви її перевірите: він буває впевнено неправий у фактах."
      error="Опишіть тему: від 3 до 500 символів."
    >
      <textarea
        vdInput
        rows="2"
        formControlName="prompt"
        placeholder="Наприклад: кіно 90-х, середня складність"
        [attr.maxlength]="maxLength"
      ></textarea>
    </vd-field>
    @if (providers().length > 1) {
      <vd-segmented
        aria-label="Хто пише питання"
        [value]="provider()"
        (valueChange)="provider.set($any($event))"
      >
        <vd-segment value="auto">Авто</vd-segment>
        @for (option of providers(); track option.id) {
          <vd-segment [value]="option.id">{{ option.label }}</vd-segment>
        }
      </vd-segmented>
      <p class="choice-hint">
        «Авто» бере першу вільну модель: якщо в однієї вичерпано ліміт, наступний раунд напише інша.
      </p>
    }
    <div class="actions">
      <button vdButton type="submit" [loading]="busy()">
        <vd-icon slot="start" name="star" />
        {{ actionLabel() }}
      </button>
      <span class="status" aria-live="polite">{{ status() }}</span>
    </div>
  </form>
</section>

<vd-alert-dialog
  title="Замінити питання?"
  description="AI перепише всі раунди цього квізу, разом із картинками. Поки ви не збережете, збережена версія лишається цілою."
  confirmLabel="Замінити"
  cancelLabel="Скасувати"
  [open]="confirming()"
  [action]="replace"
  (openChange)="confirming.set($event)"
/>
