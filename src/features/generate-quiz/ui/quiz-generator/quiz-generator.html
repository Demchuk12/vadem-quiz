<section vdCard>
  <form [formGroup]="form" (ngSubmit)="start()">
    <vd-field
      label="Тема квізу"
      hint="AI напише чернетку, а ви її перевірите: він буває впевнено неправий у фактах."
      error="Опишіть тему: від 3 до 500 символів."
    >
      <textarea
        vdInput
        rows="2"
        formControlName="prompt"
        placeholder="Наприклад: кіно 90-х, середня складність"
        [attr.maxlength]="maxLength"
      ></textarea>
    </vd-field>
    <label class="vd-choice">
      <input type="checkbox" vdCheckbox formControlName="images" />
      Додати питання з фото
    </label>
    <p class="hint">Близько третини питань отримають фото з Вікіпедії.</p>
    @if (ai.providers().length > 1) {
      <vd-field
        class="provider-field"
        label="Хто пише питання"
        hint="«Авто» бере першу вільну модель: якщо в однієї вичерпано ліміт, раунд напише інша."
      >
        <vd-select [value]="ai.provider()" (valueChange)="ai.choose($any($event))">
          <vq-ai-provider-icon slot="start" [provider]="ai.provider()" />
          <vd-option value="auto" label="Авто">
            <vq-ai-provider-icon provider="auto" />
            Авто
          </vd-option>
          @for (option of ai.providers(); track option.id) {
            <vd-option [value]="option.id" [label]="option.label">
              <vq-ai-provider-icon [provider]="option.id" />
              {{ option.label }}
            </vd-option>
          }
        </vd-select>
      </vd-field>
    }
    <div class="actions">
      <button vdButton type="submit" [loading]="busy()">
        <vd-icon slot="start" name="star" />
        {{ actionLabel() }}
      </button>
      @if (busy()) {
        <vq-question-loader size="sm" [label]="status()" />
      }
    </div>
  </form>
</section>

<vd-alert-dialog
  title="Замінити питання?"
  description="AI перепише всі раунди цього квізу, разом із картинками. Поки ви не збережете, збережена версія лишається цілою."
  confirmLabel="Замінити"
  cancelLabel="Скасувати"
  [open]="confirming()"
  [action]="replace"
  (openChange)="confirming.set($event)"
/>
