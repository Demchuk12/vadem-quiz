<button vdButton variant="ghost" (click)="confirming.set(true)">{{ t().finish }}</button>

<vd-alert-dialog
  [title]="t().title"
  [description]="t().text"
  [confirmLabel]="t().confirm"
  [cancelLabel]="t().cancel"
  variant="danger"
  [open]="confirming()"
  [action]="finish"
  (openChange)="confirming.set($event)"
/>
