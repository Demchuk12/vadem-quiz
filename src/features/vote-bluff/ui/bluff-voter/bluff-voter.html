<p class="prompt">{{ t().prompt }}</p>
<div class="options" role="group" [attr.aria-label]="t().options">
  @for (option of options(); track option.id) {
    <button
      vdButton
      type="button"
      class="option"
      [variant]="chosen() === option.id ? 'primary' : 'secondary'"
      [attr.aria-pressed]="chosen() === option.id"
      [disabled]="busy()"
      (click)="vote(option.id)"
    >
      {{ option.text }}
    </button>
  }
</div>
<p class="status" aria-live="polite">
  @if (chosen()) {
    {{ t().counted }}
  }
  <span class="count">{{ t().voted(done(), total()) }}</span>
</p>
