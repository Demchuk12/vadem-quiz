<form [formGroup]="form" (ngSubmit)="submit()">
  <vd-field [label]="t().label" [hint]="t().hint" [error]="t().required">
    <input vdInput formControlName="text" [attr.maxlength]="maxLength" autocomplete="off" />
  </vd-field>
  <button vdButton type="submit" variant="primary" [loading]="busy()">
    {{ sent() ? t().change : t().send }}
  </button>
</form>
<p class="status" aria-live="polite">
  @if (sent(); as text) {
    {{ t().sent(text) }}
  }
  <span class="count">{{ t().wrote(done(), total()) }}</span>
</p>
