<form [formGroup]="form" (ngSubmit)="create()">
  <vd-segmented formControlName="mode" aria-label="Тип гри">
    <vd-segment value="board">Своя гра</vd-segment>
    <vd-segment value="bluff">Варіанти</vd-segment>
  </vd-segmented>
  <vd-field label="Назва нового квізу" error="Вкажіть назву.">
    <input vdInput formControlName="title" maxlength="120" />
  </vd-field>
  <button vdButton variant="primary" type="submit" [loading]="busy()">
    <vd-icon slot="start" name="plus" />
    Створити
  </button>
</form>
