<h2 class="heading">{{ t().heading }}</h2>

<div class="games">
  <button vdCard type="button" class="game" (click)="choose('board')">
    <span class="art board" aria-hidden="true">
      @for (value of [100, 200, 300, 200, 300, 400, 300, 400, 500]; track $index) {
        <span class="tile" [class.lit]="$index === 4">{{ value }}</span>
      }
    </span>
    <span class="name">{{ t().games.board }}</span>
    <span class="about">{{ t().boardAbout }}</span>
    <span class="meta">{{ t().boardMeta }}</span>
  </button>

  <button vdCard type="button" class="game" (click)="choose('bluff')">
    <span class="art bluff" aria-hidden="true">
      <span class="option">{{ t().bluffOptions.lie }}</span>
      <span class="option truth">{{ t().bluffOptions.truth }}</span>
      <span class="option">{{ t().bluffOptions.decoy }}</span>
    </span>
    <span class="name">{{ t().games.bluff }}</span>
    <span class="about">{{ t().bluffAbout }}</span>
    <span class="meta">{{ t().bluffMeta(facts.min, facts.max) }}</span>
  </button>
</div>

<dialog vdDialog size="sm" [open]="mode() !== null" (openChange)="$event || close()">
  <form [formGroup]="form" (ngSubmit)="create()">
    <header vdDialogHeader>
      <h2 vdDialogTitle>{{ t().dialog(gameName()) }}</h2>
    </header>
    <div vdDialogBody>
      <vd-field [label]="t().title" [error]="t().titleError">
        <input vdInput formControlName="title" maxlength="120" autocomplete="off" />
      </vd-field>
    </div>
    <footer vdDialogFooter>
      <button vdButton type="button" variant="ghost" (click)="close()">{{ t().cancel }}</button>
      <button vdButton type="submit" variant="primary" [loading]="busy()">{{ t().create }}</button>
    </footer>
  </form>
</dialog>
