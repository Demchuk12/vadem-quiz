<dialog vdDialog size="sm" [open]="player() !== null" (openChange)="onOpenChange($event)">
  <header vdDialogHeader>
    <h2 vdDialogTitle>{{ t().title(player()?.nickname ?? '') }}</h2>
    <p vdDialogDescription>{{ t().now(player()?.score ?? 0, format(player()?.score ?? 0)) }}</p>
  </header>
  <form vdDialogBody (submit)="apply($event, delta)">
    <vd-field [label]="t().by" [hint]="t().hint">
      <input vdInput #delta type="number" step="1" required />
    </vd-field>
    <div>
      <button vdButton type="submit" variant="primary" [loading]="busy()">{{ t().apply }}</button>
    </div>
  </form>
</dialog>
