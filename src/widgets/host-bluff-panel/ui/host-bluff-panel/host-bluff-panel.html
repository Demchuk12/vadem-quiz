@if (store.room(); as room) {
  <div class="head">
    <vq-bluff-fact />
    <vq-phase-timer />
  </div>

  @if (room.state !== 'bluff_reveal' && fact(); as hostFact) {
    <dl class="secret">
      <div>
        <dt>{{ t().truth }}</dt>
        <dd>{{ hostFact.truth }}</dd>
      </div>
      <div>
        <dt>{{ t().decoy }}</dt>
        <dd>{{ hostFact.decoy }}</dd>
      </div>
    </dl>
  }

  @if (room.state === 'bluff_reveal' || room.state === 'bluff_voting') {
    <vq-bluff-reveal />
  }
  @if (room.state !== 'bluff_reveal') {
    <vq-bluff-progress />
  }

  <div class="actions">
    <button vdButton variant="primary" size="lg" [loading]="host.busy()" (click)="next()">
      @switch (room.state) {
        @case ('bluff_writing') {
          {{ t().openVoting }}
        }
        @case ('bluff_voting') {
          {{ t().reveal }}
        }
        @default {
          {{ last() ? t().results : t().next }}
        }
      }
    </button>
  </div>
}
