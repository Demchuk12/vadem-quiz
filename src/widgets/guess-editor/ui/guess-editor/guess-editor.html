<vd-field [label]="t().title">
  <input vdInput maxlength="120" [value]="quiz().title" (input)="setTitle($event)" />
</vd-field>

<vq-clock-setting
  [label]="t().clock"
  [secondsLabel]="t().clockSeconds"
  [value]="quiz().guessSeconds ?? null"
  [defaultSeconds]="defaultSeconds"
  (valueChange)="setClock($event)"
/>

<p class="hint">{{ t().about }}</p>

<ol class="questions">
  @for (question of quiz().guesses; track $index; let i = $index) {
    <li vdCard class="question">
      <div class="head">
        <span>
          <span class="number">{{ t().question(i + 1) }}</span>
          @if (!isComplete(question)) {
            <span class="incomplete"> · {{ t().incomplete }}</span>
          }
        </span>
        <button
          vdButton
          variant="ghost"
          iconOnly
          [attr.aria-label]="t().remove(i + 1)"
          [disabled]="quiz().guesses.length <= 1"
          (click)="remove(i)"
        >
          <vd-icon name="trash" />
        </button>
      </div>
      <vd-field [label]="t().text" [hint]="i === 0 ? t().textHint : ''">
        <textarea
          vdInput
          rows="2"
          [attr.maxlength]="lengths.text"
          [value]="question.text"
          (input)="set(i, { text: valueOf($event) })"
        ></textarea>
      </vd-field>
      <div class="pair">
        <vd-field [label]="t().answer" [error]="t().answerError">
          <input
            vdInput
            inputmode="decimal"
            autocomplete="off"
            [invalid]="isWrong(i, question)"
            [touched]="true"
            [value]="answerText(i, question)"
            (change)="setAnswer(i, $event)"
          />
        </vd-field>
        <vd-field [label]="t().unit" [hint]="i === 0 ? t().unitHint : ''">
          <input
            vdInput
            [attr.maxlength]="lengths.unit"
            [value]="question.unit"
            (input)="set(i, { unit: valueOf($event) })"
          />
        </vd-field>
      </div>
      <vd-field [label]="t().explanation" [hint]="i === 0 ? t().explanationHint : ''">
        <textarea
          vdInput
          rows="2"
          [attr.maxlength]="lengths.explanation"
          [value]="question.explanation"
          (input)="set(i, { explanation: valueOf($event) })"
        ></textarea>
      </vd-field>
    </li>
  }
</ol>

<div class="footer">
  <button vdButton [disabled]="quiz().guesses.length >= limits.max" (click)="add()">
    <vd-icon slot="start" name="plus" />
    {{ t().add }}
  </button>
  <span class="count">{{ t().count(quiz().guesses.length, limits.max, limits.min) }}</span>
</div>
