@if (quizzes().length === 0) {
  <div vdEmptyState icon="folder">
    <p vdEmptyStateTitle>{{ t().empty }}</p>
    <p vdEmptyStateDescription>{{ t().emptyText }}</p>
  </div>
} @else {
  <ul>
    @for (quiz of quizzes(); track quiz.id) {
      <li vdCard>
        <div class="row">
          <span class="title">
            {{ quiz.title }}
            @if (quiz.mode === 'bluff') {
              <span vdBadge variant="accent">{{ t().bluff }}</span>
            }
          </span>
          <div class="actions">
            @if (quiz.lastRoomCode; as code) {
              <a vdButton size="sm" [routerLink]="['/host', code]">{{ t().game(code) }}</a>
            }
            <vq-start-room-button [quiz]="quiz" />
            <a vdButton size="sm" [routerLink]="['/quizzes', quiz.id]">
              <vd-icon slot="start" name="pencil" />
              {{ t().edit }}
            </a>
            <vq-delete-quiz-button [quiz]="quiz" (deleted)="refresh()" />
          </div>
        </div>
      </li>
    }
  </ul>
}
