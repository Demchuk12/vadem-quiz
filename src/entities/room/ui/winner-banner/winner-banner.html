<div class="burst" aria-hidden="true">
  @for (block of blocks; track $index) {
    <span
      class="block"
      [style.--x]="block.x"
      [style.--y]="block.y"
      [style.animation-delay]="block.delay"
    ></span>
  }
</div>
<h2>Гру завершено</h2>
@if (winner(); as player) {
  <p>Перемагає {{ player.nickname }}: {{ format(player.score) }}</p>
}
