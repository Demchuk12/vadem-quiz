@if (store.ranked().length === 0) {
  <div vdEmptyState icon="users" size="sm">
    <p vdEmptyStateTitle>{{ t().standings.empty }}</p>
  </div>
} @else {
  <ol vdLeaderboard [attr.aria-label]="t().standings.label">
    @for (entry of store.ranked(); track entry.player.id) {
      <li
        vdLeaderboardRow
        [attr.data-player-id]="entry.player.id"
        [rank]="entry.rank"
        [name]="entry.player.nickname"
        [score]="format(entry.player.score)"
        [negative]="entry.player.score < 0"
        [current]="entry.player.id === currentPlayerId()"
        [inactive]="isOffline(entry.player)"
        [change]="changes().get(entry.player.id) ?? null"
      >
        @if (isOffline(entry.player)) {
          <span vdBadge>{{ t().standings.offline }}</span>
        }
        @if (editable()) {
          <button
            slot="actions"
            vdButton
            variant="ghost"
            size="sm"
            iconOnly
            [attr.aria-label]="t().standings.adjust(entry.player.nickname)"
            (click)="adjust.emit(entry.player)"
          >
            <vd-icon name="pencil" />
          </button>
        }
      </li>
    }
  </ol>
}
