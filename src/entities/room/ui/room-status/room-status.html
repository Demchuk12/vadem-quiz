@switch (status()) {
  @case ('loading') {
    <vq-question-loader class="loader" [label]="t().status.connecting" />
  }
  @case ('not_found') {
    <div vdAlert variant="danger" role="alert">
      <p vdAlertTitle>{{ t().status.notFound }}</p>
      <p>{{ t().status.notFoundHelp }}</p>
    </div>
    <a vdButton routerLink="/join">{{ t().status.toJoin }}</a>
  }
  @case ('error') {
    <div vdAlert variant="danger" role="alert">
      <p vdAlertTitle>{{ t().status.failed }}</p>
      <p>{{ t().status.failedHelp }}</p>
    </div>
  }
}
