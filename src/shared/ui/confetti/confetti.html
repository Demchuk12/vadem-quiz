@for (piece of pieces(); track $index) {
  <span
    class="piece"
    [attr.data-kind]="piece.kind"
    [attr.data-tone]="piece.tone"
    [style.--x]="piece.x"
    [style.--y]="piece.y"
    [style.--turn]="piece.turn"
    [style.animation-delay]="piece.delay"
  >
    @if (piece.kind === 'question') {
      <svg viewBox="-22 -36 44 70">
        <path d="M-15-17a15 15 0 1 1 23 13c-6 4-8 7-8 12" />
        <circle cy="26" r="5.5" />
      </svg>
    }
  </span>
}
