<svg width="100%" height="100%" focusable="false">
  <defs>
    <pattern [attr.id]="id" width="14" height="14" patternUnits="userSpaceOnUse">
      <path
        fill="none"
        stroke-linecap="round"
        [attr.d]="look().path"
        [attr.stroke]="thread"
        [attr.stroke-width]="look().stroke"
      />
      @if (look().fill; as fill) {
        <path [attr.d]="fill" [attr.fill]="thread" />
      }
    </pattern>
  </defs>
  <rect width="100%" height="100%" [attr.fill]="look().color" />
  <rect width="100%" height="100%" [attr.fill]="'url(#' + id + ')'" />
</svg>
