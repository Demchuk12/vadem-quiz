<section class="hero">
  <div class="banner"><vq-tile-banner /></div>
  <div class="hero-text">
    <h1>{{ t().title }}</h1>
    <p>{{ t().tagline }}</p>
  </div>
</section>

<div class="panel">
  <div class="panel-content">
    <h2>{{ t().join }}</h2>
    <p class="hint">{{ t().hint }}</p>
    @if (lastGame; as game) {
      <a vdButton [routerLink]="['/play', game]">
        <vd-icon slot="start" name="arrow-right" />
        {{ t().back(game) }}
      </a>
    }
    <vq-join-form [code]="code()" />
    <vq-install-app-button />
  </div>
</div>
